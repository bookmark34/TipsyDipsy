{% extends 'base.html' %}

{% block content %}
<div class="py-2">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="td-confirm-card">
                <div class="td-warn-icon">
                    <i class="bi bi-exclamation-triangle"></i>
                </div>
                <h2>Delete Product</h2>

                <p>Are you sure you want to delete <strong>{{ product.name }}</strong>?</p>
                <p style="color: var(--td-text-muted); font-size: 0.85rem;">This action cannot be undone.</p>

                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button class="btn btn-td-danger flex-grow-1" type="submit" style="max-width: 200px;">
                            <i class="bi bi-trash me-1"></i> Delete
                        </button>
                        <a href="{% url 'vendor_dashboard' %}" class="btn btn-td-outline flex-grow-1" style="max-width: 200px;">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
