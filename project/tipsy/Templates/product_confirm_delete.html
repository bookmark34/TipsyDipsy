{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h2 class="mb-4">Delete Product</h2>

                    <p class="mb-3">Are you sure you want to delete <strong>{{ product.name }}</strong>?</p>
                    <p class="text-muted small">This action cannot be undone.</p>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button class="btn btn-danger flex-grow-1" type="submit">Delete</button>
                            <a href="{% url 'vendor_dashboard' %}" class="btn btn-outline-secondary flex-grow-1">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
