{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-5">
                    <h2 class="mb-4 fw-500">Log in</h2>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            {{ form.username }}
                            <div class="text-danger small">{{ form.username.errors }}</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            {{ form.password }}
                            <div class="text-danger small">{{ form.password.errors }}</div>
                        </div>

                        <button class="btn btn-dark w-100 py-2 mb-3" type="submit">
                            Log in
                        </button>

                        <p class="text-center text-muted small">
                            Don't have an account? <a href="{% url 'signup' %}" class="text-decoration-none">Sign up</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .form-control {
        border: 1px solid #ddd;
        padding: 0.6rem 0.75rem;
        font-size: 0.95rem;
    }
    
    .form-control:focus {
        border-color: #999;
        box-shadow: 0 0 0 0.2rem rgba(0, 0, 0, 0.05);
    }
    
    .form-label {
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
        color: #333;
    }
</style>
{% endblock %}

</body>

</html>
